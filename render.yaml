services:
  - type: web
    name: instadownloader
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SITE_NAME
        value: SaveIt
      - key: SITE_URL
        value: https://your-domain.com
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: MAX_FILESIZE_MB
        value: "500"
