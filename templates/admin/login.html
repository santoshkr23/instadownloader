{% extends "admin/base.html" %}
{% block title %}Log in{% endblock %}
{% block bare %}
<div style="min-height:100vh;display:grid;place-items:center;padding:16px">
  <form method="post" action="/admin/login" class="card" style="width:100%;max-width:360px;display:grid;gap:14px">
    <div class="brand" style="padding:0"><span>↓</span>{{ site_name }} admin</div>
    {% if flash %}<div class="flash {{ 'ok' if flash.ok else 'bad' }}" style="margin:0">{{ flash.message }}</div>{% endif %}
    {% if locked %}
      <div class="warn" style="margin:0"><b>Admin is locked.</b>Set <code>ADMIN_PASSWORD</code> in Render → Environment, then reload.</div>
    {% else %}
      <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <button class="primary">Log in</button>
    {% endif %}
  </form>
</div>
{% endblock %}
