name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - data/stats.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - name: Build static pages
        env:
          # Set repo variable API_BASE (Settings → Secrets and variables → Actions → Variables)
          # if your Render URL is different.
          API_BASE: ${{ vars.API_BASE || 'https://instadownloader-ce1o.onrender.com' }}
          BASE_PATH: /${{ github.event.repository.name }}
        run: python build_static.py
      - name: Push to gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
